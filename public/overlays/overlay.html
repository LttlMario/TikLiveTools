<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{--pink:#ff3f76;--violet:#8957ff;--gold:#ffd34e;--cyan:#53e4ff}*{box-sizing:border-box}html,body{margin:0;background:transparent;color:#fff;font-family:Arial,sans-serif;overflow:hidden}#app{width:100%;min-height:150px;padding:18px;text-shadow:0 2px 6px #000}.title{font-size:25px;font-weight:800;letter-spacing:.4px;margin-bottom:12px;color:#fff}.title span{color:var(--pink)}.muted{opacity:.75;font-size:15px}.row{display:flex;gap:12px;align-items:center;margin:9px 0;font-size:18px;animation:slideIn .5s both}.rank{width:28px;color:var(--gold);font-weight:900}.user{flex:1}.value{font-weight:800;color:#fff}.panel{background:linear-gradient(135deg,rgba(255,63,118,.28),rgba(137,87,255,.25));border:1px solid rgba(255,255,255,.28);border-radius:18px;padding:16px;backdrop-filter:blur(5px);box-shadow:0 10px 35px rgba(0,0,0,.25);overflow:hidden;position:relative}.panel:after{content:"";position:absolute;inset:-50%;background:linear-gradient(100deg,transparent 40%,rgba(255,255,255,.16) 50%,transparent 60%);animation:shine 4s linear infinite}.progress{height:17px;background:rgba(0,0,0,.38);border-radius:99px;overflow:hidden;margin-top:10px}.fill{height:100%;background:linear-gradient(90deg,var(--pink),var(--violet),var(--cyan));border-radius:99px;transition:width .8s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 16px var(--pink)}.goal-line{display:flex;justify-content:space-between;font-weight:700}.jar-wrap{display:flex;align-items:center;gap:22px}.jar{height:115px;width:100px;border:4px solid rgba(255,255,255,.8);border-top:0;border-radius:8px 8px 24px 24px;position:relative;overflow:hidden;background:linear-gradient(90deg,rgba(255,255,255,.2),rgba(255,255,255,.03));box-shadow:inset 0 -10px 0 rgba(255,211,78,.14),0 0 20px rgba(255,211,78,.25)}.jar:before{content:"";position:absolute;left:-8px;right:-8px;top:-8px;height:14px;border:4px solid rgba(255,255,255,.8);border-radius:9px;background:rgba(255,255,255,.12)}.coin{position:absolute;width:13px;height:13px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold);animation:coinDrop 1.8s ease-in infinite}.coin:nth-child(2){left:18%;animation-delay:.2s}.coin:nth-child(3){left:42%;animation-delay:.8s}.coin:nth-child(4){left:68%;animation-delay:1.1s}.coin:nth-child(5){left:82%;animation-delay:.5s}.coin:nth-child(6){left:30%;animation-delay:1.5s}.jar-fill{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(#ffd34e,#c87b17);opacity:.8;transition:height 1s}.alert{display:flex;align-items:center;gap:14px;padding:16px 20px;border-radius:18px;background:linear-gradient(105deg,#ec2d68,#7a43df);border:1px solid rgba(255,255,255,.5);animation:alertIn .65s cubic-bezier(.2,1.4,.4,1) both;box-shadow:0 0 35px rgba(255,63,118,.6)}.avatar{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#15121b;border:3px solid #fff;font-size:23px}.sparkles{position:absolute;inset:0;pointer-events:none}.sparkles i{position:absolute;width:5px;height:5px;background:#fff;border-radius:50%;animation:twinkle 1.5s infinite}.sparkles i:nth-child(1){left:8%;top:20%}.sparkles i:nth-child(2){left:88%;top:30%;animation-delay:.5s}.sparkles i:nth-child(3){left:70%;top:80%;animation-delay:.9s}.battle{display:grid;gap:10px}.battle-row{display:flex;align-items:center;gap:10px}.battle-label{width:90px;font-weight:800}.battle-bar{flex:1;height:22px;border-radius:99px;background:rgba(0,0,0,.35);overflow:hidden}.battle-fill{height:100%;background:linear-gradient(90deg,#3ee7ff,#476bff);transition:width .7s}.battle-row:nth-child(2) .battle-fill{background:linear-gradient(90deg,#ff3b75,#ff9b43)}@keyframes slideIn{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}@keyframes alertIn{from{opacity:0;transform:scale(.6) translateY(25px)}to{opacity:1;transform:none}}@keyframes coinDrop{0%{top:-20px;opacity:0;transform:rotate(0)}15%{opacity:1}80%{opacity:1}100%{top:104px;opacity:0;transform:rotate(360deg)}}@keyframes shine{0%{transform:translateX(-40%) rotate(15deg)}100%{transform:translateX(40%) rotate(15deg)}}@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:1;transform:scale(1.8)}}
</style><style>.firework{height:145px;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 82%,#ffad33 0 3px,transparent 4px)}.firework:before,.firework:after{content:'✦ ✧ ✦ ✧ ✦';position:absolute;left:50%;top:48%;font-size:30px;color:#ffd34e;letter-spacing:24px;animation:explode 1.6s ease-out infinite}.firework:after{color:#ff3f76;font-size:22px;animation-delay:.45s}.snow{height:150px;overflow:hidden;position:relative;background:linear-gradient(#15284a,#1e3560);border-radius:16px}.snow i{position:absolute;top:-20px;color:#fff;font-size:22px;animation:snow 4s linear infinite}.snow i:nth-child(2){left:18%;animation-delay:.8s}.snow i:nth-child(3){left:38%;animation-delay:1.7s}.snow i:nth-child(4){left:62%;animation-delay:.4s}.snow i:nth-child(5){left:84%;animation-delay:2.2s}.rotator{display:flex;gap:12px;animation:rotator 5s ease-in-out infinite}.social{padding:14px 18px;border-radius:12px;background:#101018;border:1px solid #ff3f76;font-size:20px}.emoji-rain{height:130px;overflow:hidden;position:relative}.emoji-rain i{position:absolute;left:-30px;font-size:28px;animation:emoji 3.5s linear infinite}.emoji-rain i:nth-child(2){top:30%;animation-delay:1s}.emoji-rain i:nth-child(3){top:65%;animation-delay:2s}.wheel{width:145px;height:145px;margin:auto;border-radius:50%;border:8px solid #fff;background:conic-gradient(#ff3f76 0 25%,#8c5bff 25% 50%,#31d7e8 50% 75%,#ffb43f 75%);animation:spinWheel 3s cubic-bezier(.2,.8,.2,1) infinite;display:grid;place-items:center;font-size:30px}.firework,.snow,.emoji-rain,.rotator,.wheel{box-shadow:0 0 24px rgba(137,87,255,.5)}@keyframes explode{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}25%{opacity:1}100%{transform:translate(-50%,-50%) scale(2.5);opacity:0}}@keyframes snow{to{transform:translateY(190px) rotate(180deg)}}@keyframes emoji{to{transform:translateX(470px) rotate(360deg)}}@keyframes rotator{0%,30%{transform:translateX(0)}35%,65%{transform:translateX(-110px)}70%,100%{transform:translateX(-220px)}}@keyframes spinWheel{to{transform:rotate(720deg)}}</style></head><body><div id="app"></div><script>
const name=location.pathname.split('/').pop(),app=document.getElementById('app');let lastEvent=null;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function header(t){return `<div class="title"><span>✦</span> ${t}</div>`}
function render(d){const s=d.stats||{},latest=d.latest;const likes=s.topLikes||[],coins=s.topCoins||[],points=s.points||[];if(name==='top-likes')return app.innerHTML=`<div class="panel">${header('MOST LIKES')} ${likes.slice(0,5).map((u,i)=>`<div class="row"><span class="rank">${i+1}</span><span class="user">${esc(u.displayName||u.uniqueId)}</span><span class="value">♥ ${Number(u.totalLikes||0).toLocaleString()}</span></div>`).join('')||'<div class="muted">Așteptăm primele like-uri...</div>'}</div>`;if(name==='top-coins')return app.innerHTML=`<div class="panel">${header('MOST COINS')} ${coins.slice(0,5).map((u,i)=>`<div class="row"><span class="rank">${i+1}</span><span class="user">${esc(u.displayName||u.uniqueId)}</span><span class="value">🪙 ${Number(u.totalCoins||0).toLocaleString()}</span></div>`).join('')||'<div class="muted">Așteptăm primul gift...</div>'}</div>`;if(name==='coin-jar'){const goal=1000,value=Math.min(Number(d.totals?.coins||0),goal),pct=Math.round(value/goal*100);return app.innerHTML=`<div class="panel">${header('COIN JAR')}<div class="jar-wrap"><div class="jar"><div class="jar-fill" style="height:${pct}%"></div><span class="coin"></span><span class="coin"></span><span class="coin"></span><span class="coin"></span><span class="coin"></span></div><div><div style="font-size:24px;font-weight:800">${value.toLocaleString()} coins</div><div class="muted">${pct}% din obiectiv</div><div class="progress"><div class="fill" style="width:${pct}%"></div></div></div></div><div class="sparkles"><i></i><i></i><i></i></div></div>`}if(name==='goals')return app.innerHTML=`<div class="panel">${header('LIVE GOALS')}<div class="goal-line"><span>♥ Likes</span><span>${Number(d.totals?.likes||0).toLocaleString()} / 10,000</span></div><div class="progress"><div class="fill" style="width:${Math.min(Number(d.totals?.likes||0)/100,100)}%"></div></div><br><div class="goal-line"><span>🪙 Coins</span><span>${Number(d.totals?.coins||0).toLocaleString()} / 1,000</span></div><div class="progress"><div class="fill" style="width:${Math.min(Number(d.totals?.coins||0)/10,100)}%"></div></div></div>`;if(name==='leaderboard')return app.innerHTML=`<div class="panel">${header('POINTS LEADERBOARD')} ${points.slice(0,5).map((u,i)=>`<div class="row"><span class="rank">${i+1}</span><span class="user">${esc(u.displayName||u.uniqueId)}</span><span class="value">★ ${Number(u.points||0).toLocaleString()}</span></div>`).join('')||'<div class="muted">Clasamentul se umple în timpul live-ului...</div>'}</div>`;if(name==='alerts'){if(!latest)return app.innerHTML=`<div class="panel">${header('LIVE ALERTS')}<div class="muted">Alertele animate vor apărea aici.</div></div>`;return app.innerHTML=`<div class="alert"><div class="avatar">${latest.type==='gift'?'🎁':latest.type==='like'?'♥':'✦'}</div><div><b>${esc(latest.displayName||'Viewer')}</b><br><span>${latest.type==='gift'?`a trimis ${esc(latest.giftName||'un gift')} • ${latest.coins||0} coins`:latest.type==='like'?'a trimis like-uri':'te urmărește acum'}</span></div><div class="sparkles"><i></i><i></i><i></i></div></div>`}if(name==='gift-battle')return app.innerHTML=`<div class="panel">${header('GIFT BATTLE')}<div class="battle"><div class="battle-row"><span class="battle-label">Team Blue</span><div class="battle-bar"><div class="battle-fill" style="width:62%"></div></div><b>62%</b></div><div class="battle-row"><span class="battle-label">Team Pink</span><div class="battle-bar"><div class="battle-fill" style="width:38%"></div></div><b>38%</b></div></div></div>`;return app.innerHTML=`<div class="panel">${header(name==='chat'?'LIVE CHAT':name==='gift-browser'?'GIFT BROWSER':'TIKLIVETOOLS')}<div class="muted">Overlay animat și conectat la evenimente live.</div></div>`}
if(name==='firework')app.innerHTML=`<div class="panel">${header('GIFT FIREWORK')}<div class="firework">✨</div></div>`;else if(name==='snow')app.innerHTML=`<div class="snow"><i>❄</i><i>❄</i><i>❅</i><i>❄</i><i>❅</i></div>`;else if(name==='social')app.innerHTML=`<div class="panel">${header('SOCIAL MEDIA')}<div class="rotator"><div class="social">▶ YouTube</div><div class="social">◎ Instagram</div><div class="social">♪ TikTok</div></div></div>`;else if(name==='emojify')app.innerHTML=`<div class="panel">${header('EMOJIFY')}<div class="emoji-rain"><i>😂</i><i>🔥</i><i>❤️</i></div></div>`;else if(name==='wheel')app.innerHTML=`<div class="panel">${header('WHEEL OF ACTIONS')}<div class="wheel">GO!</div></div>`;else if(name==='timer')app.innerHTML=`<div class="panel">${header('TIMER')}<div style="font-size:54px;font-weight:900;text-align:center;color:var(--gold)">05:00</div></div>`;
async function refresh(){try{const r=await fetch('/api/overlay/'+encodeURIComponent(name)+'/data');render(await r.json())}catch(e){if(!['firework','snow','social','emojify','wheel','timer'].includes(name))app.innerHTML='<div class="panel">Server local indisponibil</div>'}}refresh();setInterval(refresh,2000);const ws=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/ws`);ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='event'||m.type==='action')refresh();if(m.type==='tts'&&typeof window.speakTts==='function')window.speakTts(m.text,m.settings)};
</script></body></html>
