<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;background:transparent;color:#fff;font-family:Arial,sans-serif}#app{min-width:360px;min-height:100px;padding:18px;text-shadow:0 2px 5px #000}h2{margin:0 0 12px;color:#ff4f79;font-size:25px}.row{display:flex;gap:12px;align-items:center;margin:8px 0;font-size:19px}.rank{width:30px;color:#ffd34d;font-weight:bold}.muted{opacity:.7;font-size:15px}.bar{height:16px;background:#29252e;border-radius:99px;overflow:hidden;margin-top:10px}.fill{height:100%;background:linear-gradient(90deg,#ff3c72,#8c5bff);transition:width .4s}</style></head><body><div id="app"><h2>TikLiveTools</h2><div class="muted">Se încarcă overlay-ul...</div></div><script>
const name=location.pathname.split('/').pop(),app=document.getElementById('app');
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(d){const title={"top-likes":"Most Likes","top-coins":"Most Coins","leaderboard":"Points Leaderboard","coin-jar":"Coin Jar","goals":"LIVE Goals",alerts:"Live Alerts",chat:"Live Chat","gift-battle":"Gift Battle"}[name]||'TikLiveTools';if(name==='top-likes'||name==='top-coins'||name==='leaderboard'){const list=name==='top-likes'?d.stats.topLikes:name==='top-coins'?d.stats.topCoins:d.stats.points;app.innerHTML=`<h2>${title}</h2>${list.slice(0,5).map((u,i)=>`<div class="row"><span class="rank">${i+1}</span><span>${esc(u.displayName||u.uniqueId)}</span><b>${name==='top-likes'?Number(u.totalLikes||0).toLocaleString():name==='top-coins'?Number(u.totalCoins||0).toLocaleString():Number(u.points||0).toLocaleString()}</b></div>`).join('')||'<div class="muted">Nu există date încă</div>'}`;return}if(name==='coin-jar'){const goal=1000,value=Math.min(d.totals.coins,goal),pct=Math.round(value/goal*100);app.innerHTML=`<h2>Coin Jar</h2><div>${value.toLocaleString()} / ${goal.toLocaleString()} coins</div><div class="bar"><div class="fill" style="width:${pct}%"></div></div>`;return}if(name==='goals'){app.innerHTML=`<h2>LIVE Goals</h2><div>Likes: ${d.totals.likes.toLocaleString()}</div><div>Coins: ${d.totals.coins.toLocaleString()}</div>`;return}if(name==='alerts'&&d.latest){app.innerHTML=`<h2>${esc(d.latest.type)}</h2><div>${esc(d.latest.displayName)} ${d.latest.giftName?`• ${esc(d.latest.giftName)}`:''}</div>`;return}app.innerHTML=`<h2>${title}</h2><div class="muted">Overlay activ și conectat la TikLiveTools</div>`}
async function refresh(){try{const r=await fetch('/api/overlay/'+encodeURIComponent(name)+'/data');render(await r.json())}catch(e){app.innerHTML='<h2>TikLiveTools</h2><div class="muted">Serverul local nu răspunde</div>'}}refresh();setInterval(refresh,2000);const ws=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/ws`);ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='action'||m.type==='event')refresh();if(m.type==='tts'&&'speechSynthesis'in window){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(m.text))}};
</script></body></html>
