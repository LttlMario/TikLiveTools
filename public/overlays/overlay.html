<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent;color:white;font-family:Arial,sans-serif}#app{min-width:360px;min-height:120px;padding:20px;text-shadow:0 2px 5px #000}h2{margin:0 0 10px;color:#ff4f79}</style></head><body><div id="app"><h2>TikLiveTools</h2><div>Overlay conectat. Așteaptă evenimente...</div></div><script>const app=document.getElementById('app');const ws=new WebSocket(`ws://${location.host}/ws`);ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='event'){const x=m.event;app.innerHTML=`<h2>${x.type.toUpperCase()}</h2><div>${x.displayName||x.uniqueId||''} ${x.giftName?`• ${x.giftName}`:''} ${x.coins?`• ${x.coins} coins`:''}</div>`;setTimeout(()=>{app.innerHTML='<h2>TikLiveTools</h2><div>Overlay conectat.</div>'},5000)}};</script></body></html>
